repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: forbid-new-submodules
  - repo: local
    hooks:
      - id: no-secrets
        name: 禁止提交 .env 与 PDF
        entry: bash -c 'git diff --cached --name-only | grep -Eq "\.pdf$|(^|/)\.env$" && { echo "禁止提交 PDF 或 .env"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
