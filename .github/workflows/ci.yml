name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: CLI smoke
        run: |
          meta-coding --help
          meta-coding verify --all
      - name: Hygiene gate
        run: |
          if git ls-files | grep -Eq '\.pdf$|(^|/)\.env$'; then
            echo "仓库中出现 PDF 或 .env"; exit 1
          fi
          pytest -q tests/test_repo_hygiene.py
